en:[d.jsx("h2",{children:"Présentation"}),d.jsx("p",{children:"J'ai en tête deux univers pour mes projets de manga, que j'appelle provisoirement :"}),d.jsxs("ul",{className:"article-list",children:[d.jsxs("li",{children:[d.jsx("strong",{children:"Edenia"})," : l'univers fantasy ;"]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Arcana"})," : l'univers urbain moderne."]})]}),d.jsx("p",{children:"Les deux univers sont séparés, et tous les deux en sont à un stade embryonnaire."}),d.jsxs("figure",{className:"article-figure",children:[d.jsx("img",{src:eo,alt:"Couverture de Samouraï Usagi, tome 1"}),d.jsx("figcaption",{children:"Samouraï Usagi, tome 1 (image de test)"})]}),d.jsx("h3",{children:"Inspirations majeures"}),d.jsxs("ul",{className:"article-list",children:[d.jsxs("li",{children:[d.jsx("strong",{children:"Worm"})," (j'en suis à l'arc 9)."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"The Stormlight Archive"})," (je n'ai lu que les 11 premiers chapitres)."]})]})]}),d.jsxs("section",{className:"article-section tone-violet",id:"genealogie",children:[d.jsx("h2",{children:"Généalogie"}),d.jsx("h3",{children:"La Fondation SCP, le point de départ"}),d.jsxs("p",{children:["Ma source d'inspiration première, celle qui relie énormément de choses, c'est la Fondation SCP. Je l'ai découverte vers 12-14 ans, je ne sais plus exactement. Ma première porte d'entrée a été SCP-173",d.jsx(jt,{n:1}),"."]}),d.jsxs("p",{children:["J'ai ensuite approfondi mes recherches. Je ne sais plus exactement quand, mais c'est la vidéo de LinksTheSun sur Halloween et les SCP",d.jsx(jt,{n:2})," qui a été le vrai point d'entrée : c'est là que j'ai commencé à vouloir en savoir plus. À cette époque, j'aimais beaucoup SCP-106, SCP-105, SCP-096, SCP-076 et aussi SCP-682 : les plus populaires."]}),d.jsx("p",{children:"Je ne sais pas vraiment ce qui me plaisait chez eux. Ils étaient surtout populaires, et c'étaient les seuls qui étaient surreprésentés. Il y avait aussi le fait qu'ils représentaient des monstres avec une limite originale. SCP-682, c'était surtout pour son aspect badass, pareil pour SCP-076."}),d.jsxs("p",{children:["Ce n'est que plus tard, vers 18-22 ans, que j'ai essayé d'en savoir encore plus, grâce à la vidéo de Mythologics sur les SCP",d.jsx(jt,{n:3}),". C'est là que je me suis intéressé aux tales et aux canons."]}),d.jsx("p",{className:"aside-note",children:"Je raconte cette partie de mémoire : les âges et l'ordre ne sont peut-être pas exacts."}),d.jsx("h3",{children:"Des SCP à leurs inspirations"}),d.jsx("p",{children:"L'attrait pour cet univers m'a donné envie d'en savoir plus sur ses inspirations."}),d.jsxs("ul",{className:"article-list",children:[d.jsxs("li",{children:[d.jsx("strong",{children:"H. P. Lovecraft"})," : je l'ai découvert surtout grâce à ça, et encore aujourd'hui, c'est mon auteur de romans préféré. Je ne sais pas si j'avais lu ",d.jsx("em",{children:"There Is No Antimemetics Division"})," avant de lire Lovecraft."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Doctor Who"})," : SCP-173 m'a fait découvrir la série, car je voulais savoir ce qu'était sa référence : l'épisode ",d.jsx("em",{children:"Blink"}),d.jsx(jt,{n:4}),". Une sacrée surprise. Dans la foulée, j'ai aussi pu comprendre l'inspiration probable de SCP-049 : les épisodes de la saison 1 autour de ",d.jsx("em",{children:"The Doctor Dances"}),"."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"La Bibliothèque de Babel"})," : l'inspiration de la Bibliothèque des Vagabonds vient peut-être des épisodes ",d.jsx("em",{children:"Silence in the Library"})," de Doctor Who, mais peut-être plus encore de ",d.jsx("em",{children:"La Bibliothèque de Babel"}),d.jsx(jt,{n:5}),". C'est grâce à ça que j'ai découvert ce livre."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Weird fiction et New Weird"})," : en m'intéressant à la Fondation SCP, j'ai découvert ces genres, dans lesquels la Fondation est ancrée."]})]}),d.jsx("p",{children:"Tout cela, c'était vraiment avant de lire Worm. À ce moment-là, j'avais déjà l'idée d'une organisation secrète (une idée potentielle que je garde toujours pour Arcana), sans avoir Worm comme inspiration."}),d.jsx("h4",{children:"Lovecraft"}),d.jsxs("p",{children:["Mes œuvres préférées de Lovecraft sont ",d.jsx("em",{children:"L'Appel de Cthulhu"}),", ",d.jsx("em",{children:"La Couleur tombée du ciel"})," et ",d.jsx("em",{children:"Le Cauchemar d'Innsmouth"}),", avec ",d.jsx("em",{children:"L'Étranger"}),". C'est l'auteur que j'ai le plus lu. Je ne suis pas un très grand lecteur, d'ailleurs je l'ai surtout écouté en livre audio."]}),d.jsx("p",{children:"Plus je le lisais, plus j'arrivais à comprendre rétroactivement les œuvres que j'aimais, car je comprenais leurs inspirations. Mais c'est aussi parce qu'il a une vraie patte : il est ingénieux et original."}),d.jsx("h3",{children:"Urban Rivals"}),d.jsxs("p",{children:["Urban Rivals",d.jsx(jt,{n:6})," est aussi une énorme source d'inspiration : c'est un jeu dont l'univers m'a frappé très jeune, vers 11 ans. Il a sans doute développé mon attrait pour les jeux de cartes en ligne et pour les univers hétéroclites, avec des gangs et des designs reconnaissables."]}),d.jsx("p",{children:"Il a une grande part d'influence. Le clan Skeelz m'a toujours marqué : pour moi, le mélange de Harry Potter et des X-Men était incroyable. J'avais environ 13 ans, je crois."}),d.jsxs("p",{children:["Parmi les autres clans, il y a les Frozn et les Raptors : le mélange des genres me plaît énormément. Les Frozn trouvaient aussi un écho avec le Yéti, un cryptide qui était déjà présent dans SCP, et avec les Mi-Go de Lovecraft. Je trouvais original de mélanger la culture nordique avec les Yétis et la technologie. Pareil pour les Raptors, avec Mad Max et Jurassic Park. Il y avait aussi les Huracan",d.jsx(jt,{n:7}),", mais surtout parce que je suis fan de catch."]}),d.jsx("h3",{children:"Le projet de jeu vidéo"}),d.jsx("p",{children:"Vers 16 ans, avec Urban Rivals et l'esthétique Capcom de Street Fighter de l'époque, j'avais en tête la création d'un jeu vidéo. Ce projet s'est légèrement transféré dans mes deux mangas."}),d.jsxs("p",{children:["C'était un jeu à la troisième personne, fortement inspiré de Gigantic",d.jsx(jt,{n:8})," : une espèce de MOBA, avec des personnages de mêlée à combos et des tireurs. Pour le design, je dirais que mes inspirations venaient d'Overwatch, de Capcom, d'Urban Rivals et de League of Legends : il y avait énormément de designs de jeux vidéo que j'appréciais."]}),d.jsx("h3",{children:"Mangas préférés"}),d.jsxs("ul",{className:"article-list",children:[d.jsxs("li",{children:[d.jsx("strong",{children:"One Piece"})," : vers 11 ans, c'était mon manga préféré."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Hunter x Hunter"})," : en grandissant, vers 14 ans je crois, il l'a détrôné."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"L'Attaque des Titans"})," : surtout la première saison, qui m'a tellement marqué qu'il est passé devant."]})]}),d.jsx("p",{children:"En grandissant, One Piece m'a paru répétitif et long, l'adaptation animée étant incroyablement lente. J'ai davantage accroché à Hunter x Hunter quand je l'ai fini. À peu près tout ce que je dis sur Worm (plus bas) se retrouve dans Hunter x Hunter."}),d.jsx("p",{children:"L'Attaque des Titans, c'était tellement différent de ce que j'avais vu avant. C'est un peu la même chose avec Game of Thrones : c'était plus sérieux, j'avais l'impression. J'avais 14 et 16 ans quand j'ai vu ces deux œuvres. Et c'était aussi extrêmement bien fichu."}),d.jsx("h3",{children:"Hearthstone et Warcraft"}),d.jsxs("p",{children:["C'est aussi vers 14 ans, je crois, que j'ai découvert Hearthstone. À ce moment-là, la Ligue des explorateurs était sortie, donc c'était peut-être plus tard",d.jsx(jt,{n:9}),". C'était la première fois que je faisais connaissance avec l'univers de Warcraft, qui a eu une grande influence sur l'esthétique d'Edenia."]}),d.jsx("h3",{children:"Worm"}),d.jsxs("p",{children:["Je ne me rappelle plus exactement comment j'ai découvert Worm. Je crois que ça s'est fait de fil en aiguille : une œuvre m'a amené à une autre, qui m'a amené à Worm. Je crois que ça a commencé sur jeuxvideo.com, où une personne avait HPMOR",d.jsx(jt,{n:10})," en signature. Après ça, je me suis intéressé à la web fiction, puis à Worm",d.jsx(jt,{n:11}),"."]}),d.jsx("p",{children:"J'ai découvert Worm en avril 2023 et j'ai commencé à le lire en décembre 2023. Je me suis arrêté au premier arc, puis j'ai repris en mai 2024, puis je me suis de nouveau arrêté, mais je ne sais plus quand."}),d.jsx("p",{children:"Pour moi, Worm est un mélange parfait de deux œuvres que j'aime énormément : Hunter x Hunter et Watchmen (une de mes œuvres préférées). En fait, j'avais l'impression de lire du Hunter x Hunter mélangé à du Watchmen. J'ai adoré, surtout à partir de l'arc 3, où ils font un braquage. Le fait que ce soient des vilains aide beaucoup aussi : c'est du Togashi."}),d.jsx("p",{children:"J'adore les combats tactiques. En plus, c'est un livre vraiment rationnel et réaliste dans sa façon de faire, et c'est une déconstruction du genre, faite de manière ingénieuse."}),d.jsx("h3",{children:"The Stormlight Archive"}),d.jsxs("p",{children:["The Stormlight Archive, c'est un peu comme Worm. Les chapitres sur Szeth et sur Cenn m'ont complètement mis dans le bain : encore une fois des combats stratégiques, puis un monde ancré dans le réel (",d.jsx("em",{children:"grounded"}),") et réaliste, avec des enjeux élevés où l'on ressent la tension. La partie où Kaladin doit déplacer un pont est incroyable."]}),d.jsx("p",{children:"L'univers est composé de personnages légendaires. Il y a aussi ça dans Worm : certains personnages ont ce mystère derrière eux, comme Scion. Et il y a cette impression de maîtrise que je retrouve dans L'Attaque des Titans."})]}),d.jsxs("section",{className:"article-section tone-gold",id:"creations",children:[d.jsx("h2",{children:"Dans mes créations"}),d.jsxs("ul",{className:"article-list",children:[d.jsxs("li",{children:[d.jsx("strong",{children:"Arcana"})," : l'idée d'une organisation qui s'occupe des affaires encombrantes, une organisation plutôt grise, inspirée de la philosophie de la Fondation SCP. Elle date d'avant ma lecture de Worm. Elle reste au stade d'idée, car ce trope est assez cliché."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Edenia"})," : l'univers de Warcraft, découvert avec Hearthstone, a eu une grande influence sur son esthétique, pour la fantasy et surtout les paysages forestiers. Mais en vrai, l'esthétique d'Edenia est beaucoup plus proche de Runeterra. Le monde hétéroclite des différents univers que j'aime y est présent, mais je trouve que c'est plutôt une convention de base, sinon le monde paraîtrait répétitif."]}),d.jsxs("li",{children:[d.jsx("strong",{children:"Mes deux mangas"})," : le projet de jeu vidéo que j'avais vers 16 ans (Urban Rivals, esthétique Capcom de Street Fighter) s'y est légèrement transféré."]})]})]}),d.jsxs("section",{className:"article-section tone-cyan",id:"commentaires",children:[d.jsx("h2",{children:"Commentaires et sources"}),d.jsx("p",{className:"aside-note",children:"Ces notes viennent de sources externes. Elles complètent le récit sans le modifier."}),d.jsxs("ol",{className:"notes-list",children:[d.jsxs("li",{id:"note-1",children:[d.jsx("strong",{children:"SCP-173"})," : premier article SCP, publié le 22 juin 2007 sur le forum /x/ de 4chan par Moto42. L'image d'origine est l'œuvre ",d.jsx("em",{children:"Untitled 2004"})," de l'artiste Izumi Kato. ",d.jsx("a",{href:"https://scp-meta.fandom.com/wiki/SCP-173",target:"_blank",rel:"noreferrer",children:"SCP Meta Wiki"})]}),d.jsxs("li",{id:"note-2",children:[d.jsx("strong",{children:"Point Culture : Creepypasta (Spécial Halloween)"})," : vidéo de LinksTheSun publiée sur YouTube le 31 octobre 2016. Sous couvert de parler de creepypastas, elle présente la Fondation SCP (SCP-173, SCP-087, SCP-682…). ",d.jsx("a     /* tour 93 : body[data-lb-nohistory] = la page gère elle-même le bouton retour (ex. l'Atelier et sa pile navPush) */
    if (!D.body.hasAttribute('data-lb-nohistory')) { try { history.pushState({ flb: 1 }, ''); pushed = true; } catch (e) { pushed = false; } }
    show(); el.focus({ preventScroll: true }); poke();
  }
  function close(fromPop, silent) {
    if (!el || el.hidden) return;
    closeInfo(); el.classList.remove('open', 'flb-ui-hidden', 'flb-idle'); el.hidden = true; H.classList.remove('flb-open');
    resetZoom(); clearTimeout(idleT);
    if (pushed && !fromPop) { pushed = false; try { history.back(); } catch (e) {} }
    pushed = false;
    if (lastFocus && lastFocus.focus) try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    /* tour 93 : prévient la page qu'on a fermé (✕, Échap, toucher le vide…) — pas envoyé si la page ferme elle-même (silent) */
    if (!silent) try { D.dispatchEvent(new CustomEvent('flb:close')); } catch (e) {}
  }
  window.addEventListener('popstate', function () { if (D.body.hasAttribute('data-lb-nohistory')) return; if (el && !el.hidden) { pushed = false; close(true); } });

  function go(i) {
    if (!list.length) return;
    idx = (i + list.length) % list.length; show();
  }
  function show() {
    var im = list[idx], t = textOf(im), src = im.currentSrc || im.src;
    resetZoom(); el.classList.remove('flb-natural');
    imgEl.classList.remove('in'); imgEl.onload = function () { imgEl.classList.add('in'); updateFull(); };
    imgEl.src = src; imgEl.alt = t.title || t.cap || ('Image ' + (idx + 1));
    if (imgEl.complete) { imgEl.classList.add('in'); updateFull(); }
    var title = t.title || ('Image ' + (idx + 1));
    el.querySelector('.flb-title').textContent = title;
    el.querySelector('.flb-capd').textContent = t.cap;
    var capm = el.querySelector('.flb-capm'); capm.textContent = t.cap; capm.classList.remove('open'); capm.hidden = !t.cap;
    el.querySelector('.flb-cnt').innerHTML = '<span class="flb-cnt-mob">' + (idx + 1) + ' / ' + list.length + '</span><span class="flb-cnt-desk"><b>' + (idx + 1) + '</b> sur <b>' + list.length + '</b></span>';
    el.querySelector('.flb-cnt-m').textContent = list.length > 1 ? (idx + 1) + ' / ' + list.length : '';
    Array.prototype.forEach.call(strip.children, function (b, i) {
      var on = i === idx; b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
      if (on) { var l = b.offsetLeft - (strip.clientWidth - b.offsetWidth) / 2; strip.scrollTo({ left: l, behavior: 'smooth' }); }
    });
    [idx + 1, idx - 1].forEach(function (k) { var n = list[(k + list.length) % list.length]; if (n) { var p = new Image(); p.src = n.currentSrc || n.src; } });
  }
  function updateFull() {
    var b = el.querySelector('.flb-full'), r = imgEl.getBoundingClientRect();
    b.hidden = !(imgEl.naturalWidth > r.width / z.s + 2);
  }
  function fullSize() {
    if (z.s > 1) { resetZoom(); el.classList.remove('flb-natural'); return; }
    var r = imgEl.getBoundingClientRect(); if (!r.width) return;
    z.s = Math.min(8, imgEl.naturalWidth / r.width); z.x = 0; z.y = 0; apply(); el.classList.add('flb-natural');
  }

  /* ---------- barres masquées après inactivité (ordinateur) ---------- */
  function poke() {
    el.classList.remove('flb-idle'); clearTimeout(idleT);
    if (!pinned && !isMobile()) idleT = setTimeout(function () { el.classList.add('flb-idle'); }, 3000);
  }

  /* ---------- clavier ---------- */
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); if (!closeInfo()) close(); }
    else if (el.querySelector('.flb-dlg')) { if (e.key !== 'Tab') return; }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
    else if (e.key === 'Tab') { // garder le focus dans la visionneuse
      var f = Array.prototype.filter.call(el.querySelectorAll('button,[tabindex="0"]'), function (b) { return !b.hidden && b.offsetParent; });
      if (!f.length) return; var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (D.activeElement === first || D.activeElement === el)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && D.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    poke();
  }

  /* ---------- zoom, glisser, toucher ---------- */
  function apply() { imgEl.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')'; el.classList.toggle('flb-zoomed', z.s > 1.01); }
  function resetZoom() { z.s = 1; z.x = 0; z.y = 0; if (imgEl) { imgEl.style.transform = ''; el.classList.remove('flb-zoomed'); } }
  function clampPan() {
    var r = view.getBoundingClientRect(), w = imgEl.offsetWidth * z.s, h = imgEl.offsetHeight * z.s;
    var mx = Math.max(0, (w - r.width) / 2), my = Math.max(0, (h - r.height) / 2);
    z.x = Math.max(-mx, Math.min(mx, z.x)); z.y = Math.max(-my, Math.min(my, z.y));
  }
  function zoomAt(cx, cy, ns) {
    var r = view.getBoundingClientRect(), ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    var k = ns / z.s; z.x = ox - (ox - z.x) * k; z.y = oy - (oy - z.y) * k; z.s = ns;
    if (z.s <= 1.01) { resetZoom(); return; } clampPan(); apply();
  }
  function gestures() {
    var pts = {}, start = null, pinch = null, lastTap = 0, tapT = 0, moved = false;
    view.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      view.setPointerCapture(e.pointerId); pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 1) { start = { x: e.clientX, y: e.clientY, zx: z.x, zy: z.y, t: Date.now() }; moved = false; }
      if (ids.length === 2) {
        var a = pts[ids[0]], b = pts[ids[1]];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: z.s, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      }
    });
    view.addEventListener('pointermove', function (e) {
      if (!pts[e.pointerId]) return; pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pts);
      if (ids.length === 2 && pinch) {
        var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
        zoomAt(pinch.cx, pinch.cy, Math.max(1, Math.min(6, pinch.s * d / pinch.d))); moved = true; return;
      }
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      if (z.s > 1.01) { z.x = start.zx + dx; z.y = start.zy + dy; clampPan(); apply(); }
    });
    function end(e) {
      if (!pts[e.pointerId]) return; delete pts[e.pointerId];
      if (Object.keys(pts).length) { start = null; return; }
      if (pinch) { pinch = null; start = null; return; }
      if (!start) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y, s = start; start = null;
      if (z.s <= 1.01 && moved) {
        // l'image ne suit plus le doigt : un geste rapide gauche/droite change seulement d'image
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { go(idx + (dx < 0 ? 1 : -1)); }
        return;
      }
      if (moved) return;
      // toucher / clic : dans le vide (hors de l'image) = fermer tout de suite
      var r = imgEl.getBoundingClientRect();
      var onImg = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!onImg && z.s <= 1.01) { clearTimeout(tapT); lastTap = 0; close(); return; }
      var now = Date.now();
      if (now - lastTap < 300) { // double toucher = zoom
        clearTimeout(tapT); lastTap = 0;
        if (z.s > 1.01) { resetZoom(); el.classList.remove('flb-natural'); } else zoomAt(e.clientX, e.clientY, 2.5);
        return;
      }
      lastTap = now;
      tapT = setTimeout(function () { if (isMobile()) el.classList.toggle('flb-ui-hidden'); }, 300);
    }
    view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end);
    view.addEventListener('dblclick', function (e) { e.preventDefault(); });
    view.addEventListener('wheel', function (e) { e.preventDefault(); if (e.ctrlKey || z.s > 1.01) zoomAt(e.clientX, e.clientY, Math.max(1, Math.min(6, z.s * (e.deltaY < 0 ? 1.15 : 0.87)))); }, { passive: false });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- déclencheurs ---------- */
  /* tour 92 : body[data-lb-manual] = la page ouvre elle-même la visionneuse via window.FLB.open (ex. l'Atelier) */
  function manual() { return !!(D.body && D.body.hasAttribute('data-lb-manual')); }
  D.addEventListener('click', function (e) {
    if (manual()) return;
    var img = e.target.closest && e.target.closest('img');
    if (!img || !eligible(img)) return;
    e.preventDefault(); e.stopPropagation(); open(groupFor(img), img);
  }, true);
  D.addEventListener('keydown', function (e) {
    if (manual()) return;
    var img = e.target; if ((e.key === 'Enter' || e.key === ' ') && img && img.tagName === 'IMG' && eligible(img)) { e.preventDefault(); open(groupFor(img), img); }
  });
  function mark(root) {
    if (manual()) return;
    Array.prototype.forEach.call((root || D).querySelectorAll('img'), function (i) {
      if (i.closest('.flb') || i.dataset.lbMarked) return;
      if (!eligible(i, false) && !i.hasAttribute('data-img')) return;
      if (i.closest('a[href]:not([href="#"])') || i.hasAttribute('data-nolightbox')) return;
      i.dataset.lbMarked = '1'; i.classList.add('flb-able'); i.tabIndex = 0; i.setAttribute('role', 'button');
      if (!i.getAttribute('aria-label')) i.setAttribute('aria-label', 'Agrandir l\u2019image' + (i.alt ? ' : ' + i.alt : ''));
    });
  }
  /* tour 92 : API publique — FLB.open(img) ouvre le groupe de l'image ; FLB.open([img, ...], imgDeDépart) ouvre une liste
     (les images peuvent être créées à la volée : new Image() + data-title / data-caption) ; FLB.close() ferme */
  window.FLB = {
    open: function (a, start) {
      if (Array.isArray(a)) { if (a.length) open(a, start && a.indexOf(start) >= 0 ? start : a[0]); }
      else if (a && a.tagName === 'IMG') open(groupFor(a).indexOf(a) >= 0 ? groupFor(a) : [a], a);
    },
    close: function (silent) { close(false, !!silent); },
    isOpen: function () { return !!(el && !el.hidden); }
  };
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', function () { mark(); }); else mark();
})();
</script><!--FLB-END--></body>
