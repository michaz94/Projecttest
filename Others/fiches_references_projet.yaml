# FICHES DE RÉFÉRENCES : projet de battle shōnen occidental (Edenia, nom provisoire)
# FICHIER UNIQUE depuis le 2026-10-09 : seule source des statuts (aucune vue ni script n'est nécessaire pour le lire).
# Épuré le 2026-10-08 à partir de l'ancien fichier (champs vides, système de pouvoirs et idées de l'IA retirés).
#
# CE FICHIER CONTIENT UNIQUEMENT : ce que l'utilisateur a dit, décidé ou écrit dans son dépôt.
# TOUT CE QUI N'Y EST PAS N'A PAS ÉTÉ DÉCIDÉ NI ENVISAGÉ. Ne rien supposer, ne pas traiter un sujet absent comme acquis,
# ne pas demander à l'utilisateur de trancher un sujet qu'il n'a pas lui-même soulevé.
#
#  source : U = dit ou décidé par l'utilisateur ; depot = écrit dans son dépôt.
#  statut_relation : influence = ce qui l'a façonné ; reference = point de comparaison ou éléments piochés.
#  statut_decision : non_precise (cité sans statut) | interet (ça lui plaît, pas une décision) | envisage (possibilité réelle, non validée) | decide.
#  limite_lecture : ce qu'il a lu ou vu ; ne rien dire au-delà (anti-spoil).
#
# Mise à jour du 2026-10-11 : structure du monde ; lieux arthuriens (décidé → envisagé, sauf Brocéliande et Le Lac) ; The Witcher 3 et Urban Rivals ;
#   éléments des brouillons de worldbuilding (niveau intérêt, hors système de magie) ; limite de lecture de The Way of Kings (15 chapitres).
# Mise à jour du 2026-10-12 : plafond des armes à feu à 1860 (décidé) ; baisse envisagée du plafond technologique général à 1914 ;
#   inégalité technologique régionale liée aux ressources magiques et naturelles (envisagé).

projet:
  nom_provisoire: Edenia
  source_nom_provisoire: U
  genre: battle shōnen occidental durable, édition traditionnelle
  cadre_valide:
  - monde de fantasy multi-héritages
  - zone western + zone industrielle de type BioShock Infinite
  - un seul monde, une seule époque
  - 'plafond technologique théorique : 1950, hors technologie magique (baisse à 1914 envisagée le 2026-10-12)'
  - 'plafond des armes à feu : 1860'
  - esthétique « archaïque mais pas trop »
  technologie:
    source: U
    date: '2026-10-12'
    plafond_armes_a_feu:
      texte: 'armes à feu plafonnées à 1860'
      statut_decision: decide
      note: 'précisé par U (« Ha j''avais oublié d''indiquer que les armes à feu sont plafonnées à 1860 »)'
    baisse_plafond_general:
      texte: 'baisser le plafond technologique général de 1950 à 1914, hors technologie magique'
      statut_decision: envisage
      note: 'formulé par U (« En fait je pense baisser la technologie à 1914 »)'
    inegalite_regionale:
      texte: 'certaines régions sont plus avancées technologiquement que d''autres ; les ressources magiques et naturelles ont un impact sur cet avancement'
      statut_decision: envisage
      note: 'formulé par U (« Je pense que je peux partir du principe que certaines régions sont plus avancées. Je pense que les ressources magiques et naturelles ont un impact, comme les autres modèles de référence que tu as cités »)'
  structure_du_monde:
    source: U
    date: '2026-10-11'
    plan:
      texte: un royaume principal, plusieurs cités-États et quelques royaumes adjacents pas forcément visités
      statut_decision: envisage
      note: 'formulé par U (« je pense à… »)'
    regions:
      texte: des régions différentes par culture et par régime
      statut_decision: envisage
    echelle:
      texte: 'problème ouvert : la logique d''échelle (ce que représentent un domaine, le pouvoir d''un baron, une cité-État, un royaume) ; U s''appuie sur l''échelle de la France entre 1000 et 1805, où un royaume est « ultra grand »'
      statut_decision: non_precise
    modele_de_monde:
      texte: 'mélange de The Witcher 3, de Runeterra et de Fullmetal Alchemist (« je ne sais pas, les trois en mélangé ») ; dosage non précisé'
      statut_decision: non_precise
    carte_du_monde:
      texte: une image de carte de fantasy sert de référence pour la carte du monde (image fournie par U, non versionnée)
      statut_decision: interet
  gimmicks_des_grands_succes:
  - gimmick: Pirate
    oeuvre: One Piece
  - gimmick: Ninja
    oeuvre: Naruto
  - gimmick: Shinigami
    oeuvre: Bleach
  - gimmick: Épéiste/Samurai
  - gimmick: Mage
  - gimmick: Exorciste
  - gimmick: Alchimiste
    oeuvre: Fullmetal Alchemist
  - gimmick: Hunter
    oeuvre: Hunter × Hunter
