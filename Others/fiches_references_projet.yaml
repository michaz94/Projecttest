# =====================================================================
# FICHES DE RÉFÉRENCES : projet de battle shōnen occidental (Edenia, nom provisoire)
# Créé le 2026-10-06. Aucun autre fichier n'a été modifié.
#
# RÈGLES DE REMPLISSAGE
#  - "" ou [] = NON TRANCHÉ. Rien n'est inventé : si tu n'as pas décidé, le champ reste vide.
#  - "options_a_trancher" = les choix possibles (issus de la frise v3 §7). Ce ne sont PAS tes décisions.
#  - "source" : U = tu l'as dit ou décidé ; depot = écrit dans ton dépôt ; IA = proposition de l'IA (à valider).
#  - "limite_lecture" : ce que tu as lu, et rien au-delà. Les fiches ne contiennent aucun contenu d'intrigue.
#  - En cas d'incohérence entre documents : la version la plus récente a été retenue.
#
# VALEURS POSSIBLES
#  statut_relation : influence | influence+reference | reference_de_comparaison | source_documentaire | famille_de_conventions | corpus_de_traditions
#  statut_decision (ÉCHELLE DÉCISIONNELLE, ajoutée le 7 oct. 2026 ; source : ta « Fiche créatures et figures folkloriques : statuts »)
#      non_precise : tu as cité l'élément sans dire son statut
#      interet     : ce qui t'intéresse ou te plaît ; pas une décision pour ton œuvre (nommé « Référence » dans ta fiche créatures ; renommé « Intérêt » le 7 oct.)
#      envisage    : élément auquel tu as réfléchi comme une possibilité réelle pour ton œuvre, sans l'avoir validé ; tu peux encore l'abandonner (définition proposée par l'IA et validée par toi le 7 oct.)
#      decide      : choisi pour ton œuvre
#      "" = pas encore classé. « interet » est distinct de la catégorie « référence » de statut_relation (voir DECISIONS_RECENTES_2026-10-07.md §3 et §3bis).
#      Une fiche peut avoir un statut_decision différent selon l'aspect : préciser dans « note » ou « aspect_vise ».
#  niveau_de_detail: ton | procede | structure | systeme | motif | esthetique | bestiaire | forme
#  emprunt_ou_ecart: emprunt | ecart_delibere | hommage_ponctuel | distance_a_maintenir | confirmation
#     (« confirmation » ajouté le 7 oct. : l'œuvre a confirmé un choix déjà voulu ; cas de Red Hood)
#  type_de_gimmick : identite (Pirate, Ninja, Samurai) | discipline (Mage, Alchimiste, Exorciste)
#                    | statut_institutionnel (titre ou licence accordé par une institution : Hunter)
#                    | mixte (identité ou discipline + statut d'institution : Shinigami, Ninja avec rangs)
#  gimmick_confiance : verifie_web (vérifié sur des sources) | memoire_IA (mon souvenir de la série, non revérifié)
#  Les champs « gimmick* » sont des PROPOSITIONS DE L'IA (source_gimmick: IA) : à valider ou corriger par toi.
# =====================================================================

