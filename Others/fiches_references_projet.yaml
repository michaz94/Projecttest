    - Shallan Davar (The Stormlight Archive)
    - Hermione Granger
    - Lisa Wilbourne (Tattletale, Worm)
    - Magik (Illyana Rasputin)
  esthetique_vestimentaire:
    decide_depuis_le_3_oct: archaïque mais pas trop
    definitions:
      archaique_mais_pas_trop: style vestimentaire qui peut paraître daté (U, 7 oct.)
      anachronisme:
        texte: éléments vestimentaires modernes présents dans un récit dont le cadre est plus ancien (U, 7 oct.)
        statut: non décidé ; « a une part de vérité » (U)
    inspire_de:
    - Radiant
    - Runeterra
    cadre_temporel_flou_comme:
    - Radiant
    - Runeterra
    - One Piece
    - Naruto
    limite_floue: '(U, 7 oct.) il ne sait pas encore où commence sa limite d''esthétique vestimentaire : elle dépend des fonctions et des statuts des personnages, et consiste parfois en éléments historiques repris dans une coupe moderne ; problème déjà cité, car ses inspirations (Radiant, Runeterra) mélangent l''histoire du vêtement dans leurs designs ; constat personnel, pas une décision'
    cadre_vestimentaire_ecole:
      statut_decision: envisage
      texte: école ou académie avec un cadre vestimentaire imposé, ou voisin d'une tenue à l'autre ; peut être présente
      importance_dans_l_histoire: inconnue (U)
      source: U
    difficulte: 'décrire ce style à une IA : ces œuvres mélangent les époques, une date ne le décrit pas ; on passe par des exemples visuels'
    references_visuelles:
    - image: Academy Ekko (modèle 3D)
      pour: Cosmo Dumas
      oeuvre: Runeterra (Academy Ekko)
      role: tenue qui l'inspire le plus
    - image: Academy Ekko (concept art)
      pour: Cosmo Dumas
      oeuvre: 'Runeterra (Academy Ekko, concept art ; crédit visible : sunnykoda.deviantart.com)'
      role: tenue qui l'inspire le plus
    - image: Fabula Fantasia, tome 1 (couverture)
      pour: Brann
      oeuvre: Fabula Fantasia (Tony Valente)
      role: inspiration moins claire ; tenue qui a sa place dans l'univers, surtout pour des « Chevaliers »
    - image: Fabula Fantasia, tome 1 (illustration)
      pour: Brann
      oeuvre: Fabula Fantasia (Tony Valente)
      role: idem
    - image: Tenue d'académie envisagée (couverture fictive « Barrier Mage »)
      pour: tenues d'académie
      oeuvre: provenance inconnue (couverture fictive « Barrier Mage », vraisemblablement générée par IA)
      role: 'tenue envisagée, pas canon (U, 7 oct. : « juste des tests » sur le sujet des tenues d''académie) ; seule différence voulue : pas de lacets aux baskets (trop moderne)'
      statut_decision: envisage
    - image: Test de tenue (style proche de Harry Potter avec un peu de Jujutsu Kaisen, dans un lieu « Shrekien »)
      pour: test de style
      oeuvre: généré par l'utilisateur
      role: 'juste un test sur le même sujet que la tenue d''académie « Barrier Mage », mais pas la même tenue (U) ; il aime beaucoup le rendu ; à propos de l''option « mêmes tenues » pour les héritages mélangés : « peut-être pas » (U)'
    - image: Garçon blond au style global voulu
      pour: style global
      oeuvre: illustration numérique de style manga, générée par l'utilisateur (IA) ; même personnage généré plusieurs fois dans plusieurs styles, à partir d'une illustration vue sur Pinterest ; plusieurs itérations existent
      role: on voit peu la tenue, mais le style et le design global du personnage correspondent à l'univers ; sert de moodboard, pas de canon
  occultisme:
    penche_vers: ambiance (atmosphère de symboles, de décors et d'objets rituels, sans que l'histoire porte dessus)
    precision_livres: '(U, 7 oct.) les livres de sorts seraient classiques et sans effet visuel magique ; sauf peut-être un accessoire lié à un pouvoir ; rien n''est décidé, détail modifiable ; ce qui compte surtout : les symboles sur le livre'
    statut: 'volontairement non tranché : l''utilisateur juge le terme trop vague ; ni thème ni sujet central pour l''instant'
  heritages_melanges:
    facons_retenues:
    - dans les mêmes tenues
    - répartis par régions
    statut: les deux façons conviennent ; articulation non décidée
  inspirations_visuelles_non_decidees:
  - element: personnages d'inspiration asiatique
    statut_decision: envisage
    note: pas décidé
  - element: objets bouddhiques japonais (perles de prière, bâton à anneau et clochettes, dangos)
    statut_decision: interet
    note: 'goût ; pas un héritage décidé ; ce sont des objets de culte, pas seulement de style (point accepté par U)'
  ambiance_des_lieux:
    statut_decision: envisage
    sources_visuelles: 'cinq images de décors naturels : trois peintures de développement de Shrek, une double page couleur du manga Naruto (chapitre 679), une illustration numérique de style manga (probablement générée par IA)'
    ambiance:
      texte: scènes d'ambiance qui dégagent une atmosphère de conte européen au sens large (tous types de contes), aventureuse
      source: U
    usage_des_images:
      texte: réservoir d'éléments à combiner (lieu, personnage, couleur, etc.) ; pas un modèle de parcours ni de voyage
      source: U
    a_preciser: vocabulaire des paysages (plaine, plateau, lande, colline, steppe) ; « montagnard » écarté comme terme pour ces images (U) ; l'utilisateur veut d'abord un vocabulaire plus précis avant d'ajouter des zones
    zones_naturelles:
    - nom: Forêt de conte
      description: forêts de feuillus et de conifères, collines herbeuses avec pierres dressées, champs et chemins ; quelques constructions anciennes en bois ou en pierre ; atmosphère de conte européen, aventureuse
      statut_decision: envisage
      source: demandé par U le 8 oct. 2026 d'après ses images de décors ; nom et formulation rédigés par l'IA, à valider
    - nom: Région montagnarde enneigée
      description: région de montagne enneigée (formulation de U)
      creature_locale: 'Barbegazi (statut des Barbegazi : envisagé, pas décidé ; U, 9 oct. 2026)'
      statut_decision: decide
      images: en attente d'images de l'utilisateur
      source: 'U, 9 oct. 2026 (« décidé, pour la région ») ; le nom reprend ses mots, formulation de l''IA'
    pierres_levees: pour l'instant seulement pour l'ambiance ; rôle non décidé ; il ne préférerait pas la même scène sans les pierres (U)
    statut_des_images: moodboard, pas canon (U) ; pas de décision sur les éléments des images
