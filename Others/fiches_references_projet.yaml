  arthurien:
    source: U
    decide:
    - noms de lieux arthuriens français uniquement
    - 'personnages arthuriens : des inspirations seulement, avec des noms différents (aucun nom direct comme Arthur, Merlin, Lancelot)'
    - 'nom de famille de Brann : « Pandragon » retiré, et le nom est laissé vide (U, 9 oct. 2026)'
    - 'se détacher de Seven Deadly Sins et de Radiant sur le plan arthurien (portée exacte non précisée ; le statut de Radiant comme référence ne change pas dans ce fichier)'
    usage_vise:
      texte: 'la dimension symbolique et allégorique n''intéresse pas U ; l''intérêt porte sur l''ambiance médiévale et sur l''étude généalogique des archétypes, tropes et procédés narratifs qui font écho à ceux du manga shōnen'
      statut_decision: interet
      source: 'U, carnet de bord (§ 3.3), 16 nov. 2026'
    personnages_arthuriens_inspirations:
    - Perceval
    - Arthur
    - Merlin
    - Lancelot
    - Gauvain
    - Morgan
    - Guenièvre
    lieux_arthuriens_decides:
    - Brocéliande
    - Le Lac (de la Dame du Lac)
    lieux_arthuriens_envisages:
    - Douloureuse Garde
    - Bénoïc
    - Gaunes
    - Trèbes
    - Montlair
    - La Terre Déserte
    note_lieux: 'U, 11 oct. 2026 : il a accepté ces lieux mais ne les connaît pas tous ; hormis Brocéliande et Le Lac, il n''a fait aucune recherche sur eux ; ils passent donc de décidé à envisagé'
    exception_lieux: 'exception décidée par l''utilisateur : lieux gardés pour la langue française du texte, même s''ils ne sont pas situés en France (La Douloureuse Garde ; sa localisation n''a pas été vérifiée)'
    abandonne:
    - Merlin, Arthur, Lancelot comme personnages de toile de fond (envisagé puis écarté le 2026-10-09)
    note_merlin: 'U, 11 oct. 2026 : Merlin était de base un personnage de l''œuvre ; la décision du 9 oct. le concernant reste la plus récente'
  personnages_edenia:
  - nom: Cosmo Dumas
    inspire_de:
    - Ekko
    - Killua Zoldyck
    - Shisui Uchiha
    tenue_inspiration: Academy Ekko (deux images), voir esthetique_vestimentaire
    note_test_pixai: 'dans les documents de tests PixAI : seul essai sur un personnage d''Edenia (« un essai », U, 15 oct. 2026), pas une piste de design (hors des 12 images du wiki)'
  - nom: Brann
    origine_prenom: 'Ben 10, puis Game of Thrones (« Bran »), puis Hearthstone (« Brann ») (U, 12 oct. 2026)'
    inspire_de:
    - Monkey D. Luffy
    - Yusuke Urameshi
    - Edward Elric
    - Perceval le Gallois
    tenue_inspiration: Fabula Fantasia (deux images), moins claire ; voir esthetique_vestimentaire
    goal:
      valeur: devenir chevalier, ou un goal similaire
      statut_decision: interet
      source: U, 9 oct. 2026
  - nom: Harley Delphine
    statut_nom: provisoire, non décidé (U, 12 oct. 2026)
    note: personnage non défini pour l'instant (U, 12 oct. 2026)
    inspire_de:
    - Shallan Davar (The Stormlight Archive)
    - Hermione Granger
    - Lisa Wilbourne (Tattletale, Worm)
    - Magik (Illyana Rasputin)
    pistes_provisoires:
      statut_decision: interet
      source: 'U, 12 oct. 2026 ; carnet de bord (§ 5.4, point 5), classé en intérêt par U le 16 nov. 2026'
      personnalite_visee: Shallan Davar, Maka Albarn (Soul Eater), Luna Lovegood (Harry Potter)
      apparence: '« pour moi son apparence ressemble à Raiponce de Tangled » (U, 12 oct. 2026)'
      origine_prenom: Gwen Tennyson (Ben 10) (U, 12 oct. 2026)
      contraste_trio: 'piste ouverte de contraste face à Brann (élan brut) et Cosmo (sang-froid agile et urbain) (carnet § 5.4, point 5)'
  esthetique_vestimentaire:
    decide_depuis_le_3_oct: archaïque mais pas trop
    definitions:
      archaique_mais_pas_trop: style vestimentaire qui peut paraître daté (U, 7 oct.)
      anachronisme:
        texte: éléments vestimentaires modernes présents dans un récit dont le cadre est plus ancien (U, 7 oct.)
        statut_decision: decide
        source: 'U, 15 oct. 2026 : esthétique vestimentaire plus moderne et anachronique, dans le style vestimentaire des 7 images de la galerie vestimentaire'
        historique: 'non décidé ; « a une part de vérité » (U, 7 oct. 2026)'
      habit_suit_la_fonction:
        texte: 'la tenue et sa coupe suivent la fonction et le statut du personnage ; hors des genres à costume, c''est le rôle qui justifie une tenue moulante (infiltration, pilotage, combinaison sous armure)'
        statut_decision: decide
        source: 'U, 28 oct. 2026 : « c''est un élément de design que je prends déjà en compte » ; « elle a raison » (analyse externe : le genre décide de la tenue moulante, hors genre le rôle l''exige)'
        historique: fonctions et statuts cités comme limite vestimentaire (U, 7 oct., voir limite_floue)
      regle_operatoire:
        texte: 'coupes shōnen dynamiques + matières et finitions d''époque (drap, cuir, laiton, broderies, sangles, pièces d''armure), hors matières urbaines contemporaines (jean, lacets modernes) réservées à Arcana ; le tout guidé par la fonction et le statut du personnage'
        statut_decision: envisage
        source: 'carnet de bord (§ 5.4, point 1), classé en envisagé par U le 16 nov. 2026 ; recoupe la réserve sur le jean des tests PixAI 09 et 10 (U, 15 oct. 2026) et sur les lacets de Barrier Mage (U, 7 oct. 2026)'
    inspire_de:
    - Radiant
    - Runeterra
    cadre_temporel_flou_comme:
    - Radiant
    - Runeterra
    - One Piece
    - Naruto
    limite_floue: '(U, 7 oct.) il ne sait pas encore où commence sa limite d''esthétique vestimentaire : elle dépend des fonctions et des statuts des personnages, et consiste parfois en éléments historiques repris dans une coupe moderne ; problème déjà cité, car ses inspirations (Radiant, Runeterra) mélangent l''histoire du vêtement dans leurs designs ; constat personnel, pas une décision (voir definitions.habit_suit_la_fonction, décidé le 28 oct., et definitions.regle_operatoire, envisagé le 16 nov.)'
    precisions_tests_15_oct: 'les 12 tests visuels PixAI sont « Edenia compatible », sauf les tests 09 et 10 qui doivent sonner légèrement moins moderne à cause du jean (U, 15 oct. 2026)'
    image_test_garcon_rejetee:
      texte: 'U n’aime pas l’image test test_tenue_edenia_garcon.png et demande de l’oublier ; rejet explicite du côté « beau gosse manhwa »'
      statut_decision: decide
      portee: 'image non canon et non-référence à reprendre ; rejet de ce rendu précis, sans déduction sur les autres personnages masculins ou sur le genre manhwa en général'
      source: U, 16 nov. 2026
    cadre_vestimentaire_ecole:
      statut_decision: envisage
      texte: école ou académie avec un cadre vestimentaire imposé, ou voisin d'une tenue à l'autre ; peut être présente
      importance_dans_l_histoire: inconnue (U)
      source: U
    difficulte: 'décrire ce style à une IA : ces œuvres mélangent les époques, une date ne le décrit pas ; on passe par des exemples visuels'
