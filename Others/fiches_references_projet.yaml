# FICHES DE RÉFÉRENCES : projet de battle shōnen occidental (Edenia, nom provisoire)
# FICHIER UNIQUE depuis le 2026-10-09 : seule source des statuts (aucune vue ni script n'est nécessaire pour le lire).
# Épuré le 2026-10-08 à partir de l'ancien fichier (champs vides, système de pouvoirs et idées de l'IA retirés).
#
# CE FICHIER CONTIENT UNIQUEMENT : ce que l'utilisateur a dit, décidé ou écrit dans son dépôt.
# TOUT CE QUI N'Y EST PAS N'A PAS ÉTÉ DÉCIDÉ NI ENVISAGÉ. Ne rien supposer, ne pas traiter un sujet absent comme acquis,
# ne pas demander à l'utilisateur de trancher un sujet qu'il n'a pas lui-même soulevé.
#
#  source : U = dit ou décidé par l'utilisateur ; depot = écrit dans son dépôt.
#  statut_relation : influence = ce qui l'a façonné ; reference = point de comparaison ou éléments piochés.
#  statut_decision : non_precise (cité sans statut) | interet (ça lui plaît, pas une décision) | envisage (possibilité réelle, non validée) | decide.
#  limite_lecture : ce qu'il a lu ou vu ; ne rien dire au-delà (anti-spoil).
#
# Mise à jour du 2026-10-11 : structure du monde ; lieux arthuriens (décidé → envisagé, sauf Brocéliande et Le Lac) ; The Witcher 3 et Urban Rivals ;
#   éléments des brouillons de worldbuilding (niveau intérêt, hors système de magie) ; limite de lecture de The Way of Kings (15 chapitres).
# Mise à jour du 2026-10-12 : plafond des armes à feu à 1860 (décidé) ; baisse envisagée du plafond technologique général à 1914 ;
#   inégalité technologique régionale liée aux ressources magiques et naturelles (envisagé).
# Mise à jour du 2026-10-22 (demandée par U) : report des corrections du 12 oct. (« Terre dévastée » = proposition de l'IA ;
#   zone mafieuse = structure sociale seulement, jamais après 1914 ; zone western = paysage ; Harley Delphine = nom provisoire,
#   personnage non défini) ; anachronisme vestimentaire décidé (U, 15 oct.) ; couche gréco-égyptienne de l'Antiquité tardive
#   (intérêt, U, 22 oct.). Les inférences de l'IA ne sont pas dans ce fichier.
# Mise à jour du 2026-10-24 (demandée par U) : Rise of the Brave Tangled Dragons, origine du choix de s'inspirer de personnages
#   d'œuvres occidentales (U, 24 oct.).
# Mise à jour du 2026-10-28 (demandée par U) : style de dessin commun à Edenia et Arcana (U, 15 oct.) ; tests PixAI = tests de style,
#   Cosmo Dumas = « un essai » (U, 15 oct.) ; atie1225 ajouté aux références (U, 15 oct.).
# Mise à jour du 2026-10-28, tour 24 (demandée par U) : « l'habit suit la fonction », étendu à la coupe (décidé, U, 28 oct.).
# Mise à jour du 2026-11-16 (demandée par U, synchronisation YAML + Edenia.html + carnet de bord) :
#   - plafond technologique général à 1914 (hors technologie magique) passé d'envisagé à décidé (U, 16 nov.) ; armes à feu toujours à 1860 (décidé) ;
#   - report des réponses de U des 12-18 oct. présentes dans Edenia.html (origine du prénom de Brann ; pistes provisoires d'Harley ;
#     sources de la zone mafieuse ; images de La Princesse et la Grenouille sur Nouvelle-Orléans et marais ; Plaines Brisées et western
#     sur la région désertique ; 5 images vestimentaires du 15 oct. ; rejet du jean sur tests 09-10 ; LoRA N&B du 17 oct. ; tier liste du 18 oct.) ;
#   - report du cadre éditorial et du registre visé du carnet de bord (§ 2, § 3.2, § 3.3 : circuit français, Action + Fantasy, 20-30 tomes,
#     approche littéraire, tonalité non « dark », rejet gag et ecchi, usage visé de l'arthurien, œuvres citées) ;
#   - report des 5 clarifications du carnet (§ 5.4) avec les statuts fixés par U le 16 nov. : registre occulte/marais/pègre non « dark » (décidé) ;
#     règle vestimentaire opératoire hors jean/lacets réservés à Arcana (envisagé) ; chara-design et rendu N&B 4 valeurs/trames (envisagé) ;
#     modernité ~1890-1914 répartie par pôles (envisagé) ; western ancré Languedoc/causses et contraste du trio (intérêt). L'hypothèse du point 6
#     reste hors de ce fichier ; limites de lecture confirmées inchangées (U, 16 nov.).
# Mise à jour du 2026-11-16, passe 2 (demandée par U, synchronisation carnet § 5.5 + YAML + Edenia.html) :
#   - positionnement d'ensemble (envisagé, U) : fantasy classique dans le fond, renouvelée par la forme manga shōnen, un folklore différent
#     et un système + des combats pensés au niveau tactique de World Trigger, Jujutsu Kaisen et Hunter × Hunter ;
#   - occultisme.place_dans_l_oeuvre passé en envisagé (U, cran 2 : esthétique et grammaire/culture concrète du surnaturel présente dans beaucoup
#     de concepts de l'œuvre, sans être un thème ni le sujet central ; registre tonal non « dark » toujours décidé ; note du 7 oct. archivée) ;
#   - structure_du_monde.feodalite ajouté en envisagé (U : système politique sous-jacent présent dans beaucoup de concepts de l'univers)
#     et fiche Féodalisme (Dictionnaire féodal 1820) précisée en conséquence ;
#   - institutions_et_statuts_en_interet ajouté en intérêt (U) : Chevalier (couche 2 = statut social et martial lié au serment dans la féodalité,
#     couche 1 optionnelle = armure lourde réservée à certains personnages, couche 3 = récits de chevalerie médiévaux et Renaissance gardés en
#     intérêt ouvert sans se limiter à un seul récit) et Scholomance (école de magie type Harry Potter, mais différente) ;
#   - pistes_systeme_de_magie ajouté (cible tactique en envisagé ; 4 briques en intérêt, U : Mana [nom provisoire], Source/Shaper/Sink/Target,
#     Body/Mind/Soul, Consciences ; le système lui-même reste non arrêté) ; ajout de la fiche Fondation SCP (wiki et Tales).
# Mise à jour complémentaire du 2026-11-16 (U, réaffirmation de la direction artistique) :
#   - orientation envisagée : œuvre située à la Belle Époque ; pour les zones rurales, conte merveilleux/fantastique dans l'esprit du Château ambulant / Miyazaki ;
#   - les musiques de BioShock, BioShock Infinite et Fallout ravivent cette envie (références d'ambiance sonore, pas transposition visuelle ni nouveaux faits de monde) ;
#   - rejet explicite de l'image test de garçon `test_tenue_edenia_garcon.png` et du rendu « beau gosse manhwa » ; cette image n'est ni canon ni référence à reprendre ;
#   - le registre occultisme non « dark » reste décidé ; aucun plafond technologique, statut de zone ou règle vestimentaire antérieure n'est modifié.

projet:
  nom_provisoire: Edenia
  source_nom_provisoire: U
  genre: battle shōnen occidental durable, édition traditionnelle
  format_editorial:
    source: 'U, carnet de bord (§ 1, § 2, § 3.1, § 3.2), 16 nov. 2026'
    circuit:
      texte: 'parution française traditionnelle par tomes complets (~180-200 pages, rythme solo de 1 à 2 tomes/an ; éditeurs de référence du créneau : Ankama, Pika, Kana, Glénat)'
      statut_decision: decide
    creneau:
      texte: Action + Fantasy
      statut_decision: decide
    longueur_visee:
      texte: '20 à 30 tomes (avec nécessité de convaincre et fonctionner dès une première tranche de 3 à 5 tomes)'
      statut_decision: decide
    second_projet:
      texte: 'Arcana : second projet d''univers urbain et moderne ; partage le même style de dessin qu''Edenia (décidé, U, 15 oct. 2026) ; les matières urbaines contemporaines comme le jean et les lacets modernes lui seraient réservées (envisagé, U, 16 nov. 2026)'
      statut_decision: non_precise
  registre_et_ton:
    source: 'U, carnet de bord (§ 3.3, § 3.5, § 5.4 et § 5.5), 16 nov. 2026'
    positionnement_d_ensemble:
      texte: 'fantasy classique assumée dans le fond, renouvelée sur trois plans : la forme (manga shōnen), un folklore différent et un système de magie ainsi que des combats pensés pour être au niveau tactique de World Trigger, Jujutsu Kaisen et Hunter × Hunter'
      statut_decision: envisage
      source: 'U, 16 nov. 2026 (carnet § 5.5)'
    approche_d_inspiration:
      texte: 'puiser prioritairement dans les œuvres littéraires et hors-manga (romans, webromans, sources historiques et folkloriques européennes et françaises), tout en conservant les mangas de référence et les exigences de narration d''un manga shōnen'
      statut_decision: envisage
    construction_d_univers:
      texte: 'univers bien construits à logique sociale, historique et matérielle ; refus d''utiliser la mythologie ou le folklore comme simple étiquette décorative (façon Seven Deadly Sins) ; intérêt pour le fonctionnement concret des organisations et des systèmes (Gotei 13, Cour infernale du Dictionnaire infernal, enfer de Dorohedoro, figures historiques et savantes, folklore français)'
      statut_decision: interet
    tonalite_visee:
      texte: 'ton non « dark » : merveilleux, mystère et aventure (Harry Potter, Le Château ambulant / Miyazaki, Le Seigneur des Anneaux), humour sec ou d''observation (Tarantino, légère touche de Terry Pratchett hors absurde), tension dramatique (Hunter × Hunter), combats tactiques (Jujutsu Kaisen, arc des Rank B Wars de World Trigger), systèmes de magie à règles définies (hard magic ; architecture non arrêtée, premiers mots-clés notés en intérêt dans pistes_systeme_de_magie), ampleur épique et vraisemblance (Worm, The Stormlight Archive : conséquences et psychologie traitées sérieusement)'
      statut_decision: envisage
    exclusions_de_ton:
      texte: 'rejet de l''humour gag et de l''ecchi japonais (carnet § 3.3) ; registre de l''occulte, du marais et de la pègre non « dark », sans gothique poisseux ni grimdark (décidé, U, 16 nov. 2026 ; voir occultisme.registre_tonal)'
      statut_decision: decide
    orientation_belle_epoque_et_merveilleux_rural:
      texte: 'envie de situer l’œuvre à la Belle Époque, avec pour les zones rurales un registre de conte merveilleux et fantastique, dans l’esprit du Château ambulant / Miyazaki ; la réécoute des musiques de BioShock, BioShock Infinite et Fallout ravive cette direction (inspiration musicale/émotionnelle, pas une demande de transposition de leur univers)'
      statut_decision: envisage
      source: 'U, 16 nov. 2026 ; formulation personnelle « je pense que je veux », donc orientation exprimée, sans nouvelle répartition détaillée des zones'
      note: 'ne modifie pas le plafond technologique général déjà décidé à 1914 ni le principe des pôles d’époque inégaux encore envisagé ; registre occulte non « dark » demeure décidé'
  cadre_valide:
  - monde de fantasy multi-héritages
  - 'zone western + zone industrielle de type BioShock Infinite (zone western = un paysage ; le mode de vie n''est pas encore réfléchi, U, 12 oct. 2026)'
  - un seul monde, une seule époque
  - 'plafond technologique général : 1914, hors technologie magique (abaissé depuis le plafond théorique initial de 1950 ; envisagé le 2026-10-12, décidé le 2026-11-16)'
  - 'plafond des armes à feu : 1860'
  - esthétique « archaïque mais pas trop »
  technologie:
    source: U
    date: '2026-10-12 (mis à jour le 2026-11-16)'
    plafond_armes_a_feu:
      texte: armes à feu plafonnées à 1860
      statut_decision: decide
      note: 'précisé par U (« Ha j''avais oublié d''indiquer que les armes à feu sont plafonnées à 1860 »)'
    baisse_plafond_general:
      texte: 'plafond technologique général fixé à 1914, hors technologie magique (abaissé depuis le plafond théorique initial de 1950)'
      statut_decision: decide
      note: 'envisagé le 12 oct. 2026 (« En fait je pense baisser la technologie à 1914 »), passé en décidé par U le 16 nov. 2026'
    inegalite_regionale:
      texte: certaines régions sont plus avancées technologiquement que d'autres ; les ressources magiques et naturelles ont un impact sur cet avancement
      statut_decision: envisage
      note: 'formulé par U (« Je pense que je peux partir du principe que certaines régions sont plus avancées. Je pense que les ressources magiques et naturelles ont un impact, comme les autres modèles de référence que tu as cités »)'
    repartition_par_poles:
      texte: 'modernité ~1890-1914 concentrée dans certains pôles coexistant avec des campagnes féodales / Renaissance et des forêts de conte : l''époque n''est pas uniforme, elle est répartie par pôle'
      statut_decision: envisage
      note: 'carnet de bord (§ 5.4, point 4), classé en envisagé par U le 16 nov. 2026 ; cohérent avec le pôle occulte/mafieux plafonné à 1914, l''occultisme 1890-1910 et BioShock 1'
  structure_du_monde:
    source: U
    date: '2026-10-11 (complété le 2026-11-16)'
    plan:
      texte: un royaume principal, plusieurs cités-États et quelques royaumes adjacents pas forcément visités
      statut_decision: envisage
      note: 'formulé par U (« je pense à… »)'
    regions:
      texte: des régions différentes par culture et par régime
      statut_decision: envisage
    echelle:
      texte: 'problème ouvert : la logique d''échelle (ce que représentent un domaine, le pouvoir d''un baron, une cité-État, un royaume) ; U s''appuie sur l''échelle de la France entre 1000 et 1805, où un royaume est « ultra grand »'
      statut_decision: non_precise
    modele_de_monde:
      texte: 'mélange de The Witcher 3, de Runeterra et de Fullmetal Alchemist (« je ne sais pas, les trois en mélangé ») ; dosage non précisé'
      statut_decision: non_precise
    carte_du_monde:
      texte: une image de carte de fantasy sert de référence pour la carte du monde (image fournie par U, non versionnée)
      statut_decision: interet
    feodalite:
      texte: 'système politique sous-jacent présent dans beaucoup de concepts de l''univers : organisation fondée sur des liens personnels (serment d''allégeance, service contre protection) et des pouvoirs morcelés (fiefs, chartes, privilèges, droits locaux, rivalités vassaliques), qui colore le territoire, le statut des institutions (écoles, ordres, guildes), l''accès aux ressources, la friction avec les cités-États et les pôles ~1890-1914, ainsi que des structures parallèles comme la pègre'
      statut_decision: envisage
      note: 'validé en envisagé par U le 16 nov. 2026 (carnet § 5.5 ; dépasse le simple vocabulaire ou décor local)'
