# FICHES DE RÉFÉRENCES : projet de battle shōnen occidental (Edenia, nom provisoire)
# FICHIER UNIQUE depuis le 2026-10-09 : seule source des statuts ; on modifie ICI, jamais dans la vue MD (VUE_references_projet.md, générée par generer_vue_md.py).
# Épuré le 2026-10-08 à partir de l'ancien fichier ; les retraits sont listés dans epuration_yaml_retire.md.
#
# CE FICHIER CONTIENT UNIQUEMENT : ce que l'utilisateur a dit, décidé ou écrit dans son dépôt.
# TOUT CE QUI N'Y EST PAS N'A PAS ÉTÉ DÉCIDÉ NI ENVISAGÉ. Ne rien supposer, ne pas traiter un sujet absent comme acquis,
# ne pas demander à l'utilisateur de trancher un sujet qu'il n'a pas lui-même soulevé.
#
#  source : U = dit ou décidé par l'utilisateur ; depot = écrit dans son dépôt.
#  statut_relation : influence = ce qui l'a façonné ; reference = point de comparaison ou éléments piochés.
#  statut_decision : non_precise (cité sans statut) | interet (ça lui plaît, pas une décision) | envisage (possibilité réelle, non validée) | decide.
#  limite_lecture : ce qu'il a lu ou vu ; ne rien dire au-delà (anti-spoil).

projet:
  nom_provisoire: Edenia
  source_nom_provisoire: U
  genre: battle shōnen occidental durable, édition traditionnelle
  cadre_valide:
  - monde de fantasy multi-héritages
  - zone western + zone industrielle de type BioShock Infinite
  - un seul monde, une seule époque
  - 'plafond technologique théorique : 1950, hors technologie magique'
  - esthétique « archaïque mais pas trop »
