      source: 'U, 9 oct. 2026'
  - nom: Harley Delphine
    inspire_de:
    - Shallan Davar (The Stormlight Archive)
    - Hermione Granger
    - Lisa Wilbourne (Tattletale, Worm)
    - Magik (Illyana Rasputin)
  esthetique_vestimentaire:
    decide_depuis_le_3_oct: archaïque mais pas trop
    definitions:
      archaique_mais_pas_trop: style vestimentaire qui peut paraître daté (U, 7 oct.)
      anachronisme:
        texte: éléments vestimentaires modernes présents dans un récit dont le cadre est plus ancien (U, 7 oct.)
        statut: non décidé ; « a une part de vérité » (U)
    inspire_de:
    - Radiant
    - Runeterra
    cadre_temporel_flou_comme:
    - Radiant
    - Runeterra
    - One Piece
    - Naruto
    limite_floue: '(U, 7 oct.) il ne sait pas encore où commence sa limite d''esthétique vestimentaire : elle dépend des fonctions et des statuts des personnages, et consiste parfois en éléments historiques repris dans une coupe moderne ; problème déjà cité, car ses inspirations (Radiant, Runeterra) mélangent l''histoire du vêtement dans leurs designs ; constat personnel, pas une décision'
    cadre_vestimentaire_ecole:
      statut_decision: envisage
      texte: école ou académie avec un cadre vestimentaire imposé, ou voisin d'une tenue à l'autre ; peut être présente
      importance_dans_l_histoire: inconnue (U)
      source: U
    difficulte: 'décrire ce style à une IA : ces œuvres mélangent les époques, une date ne le décrit pas ; on passe par des exemples visuels'
    references_visuelles:
    - image: Academy Ekko (modèle 3D)
      pour: Cosmo Dumas
      oeuvre: Runeterra (Academy Ekko)
      role: tenue qui l'inspire le plus
    - image: Academy Ekko (concept art)
      pour: Cosmo Dumas
      oeuvre: 'Runeterra (Academy Ekko, concept art ; crédit visible : sunnykoda.deviantart.com)'
      role: tenue qui l'inspire le plus
    - image: Fabula Fantasia, tome 1 (couverture)
      pour: Brann
      oeuvre: Fabula Fantasia (Tony Valente)
      role: inspiration moins claire ; tenue qui a sa place dans l'univers, surtout pour des « Chevaliers »
    - image: Fabula Fantasia, tome 1 (illustration)
      pour: Brann
      oeuvre: Fabula Fantasia (Tony Valente)
      role: idem
    - image: Tenue d'académie envisagée (couverture fictive « Barrier Mage »)
      pour: tenues d'académie
      oeuvre: provenance inconnue (couverture fictive « Barrier Mage », vraisemblablement générée par IA)
      role: 'tenue envisagée, pas canon (U, 7 oct. : « juste des tests » sur le sujet des tenues d''académie) ; seule différence voulue : pas de lacets aux baskets (trop moderne)'
      statut_decision: envisage
    - image: Test de tenue (style proche de Harry Potter avec un peu de Jujutsu Kaisen, dans un lieu « Shrekien »)
      pour: test de style
      oeuvre: généré par l'utilisateur
      role: 'juste un test sur le même sujet que la tenue d''académie « Barrier Mage », mais pas la même tenue (U) ; il aime beaucoup le rendu ; à propos de l''option « mêmes tenues » pour les héritages mélangés : « peut-être pas » (U)'
    - image: Garçon blond au style global voulu
      pour: style global
      oeuvre: illustration numérique de style manga, générée par l'utilisateur (IA) ; même personnage généré plusieurs fois dans plusieurs styles, à partir d'une illustration vue sur Pinterest ; plusieurs itérations existent
      role: on voit peu la tenue, mais le style et le design global du personnage correspondent à l'univers ; sert de moodboard, pas de canon
  inspirations_issues_des_brouillons:
    source: 'U, brouillons de worldbuilding (documents Worldbulding parties 1 et 2), validé le 11 oct. 2026'
    statut_decision: interet
    elements:
    - 'Bibliothèque bleue (le contenu des livres ; U précise que cela n''a rien à voir avec le métier de colporteur)'
    - 'Renaissance (la science, le folklore, les superstitions, les croyances et la magie)'
    - bas et milieu Moyen Âge
    - fantasy épique
    exclusion:
      texte: sans concept métafictionnel ni concept qui agit sur la réalité
      note: portée non précisée (peut concerner le système de magie, mis de côté pour l'instant)
  vocabulaire_des_brouillons:
    source: 'U, brouillons de worldbuilding, validé le 11 oct. 2026'
    statut_decision: interet
    titres_et_fonctions:
