  - gimmick: Shinigami
    oeuvre: Bleach
  - gimmick: Épéiste/Samurai
  - gimmick: Mage
  - gimmick: Exorciste
  - gimmick: Alchimiste
    oeuvre: Fullmetal Alchemist
  - gimmick: Hunter
