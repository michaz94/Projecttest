  arthurien:
    source: U
    decide:
    - 'noms de lieux arthuriens français uniquement'
    - 'personnages arthuriens : des inspirations seulement, avec des noms différents (aucun nom direct comme Arthur, Merlin, Lancelot)'
    - 'nom de famille de Brann : « Pandragon » retiré, et le nom est laissé vide (U, 9 oct. 2026)'
    - 'se détacher de Seven Deadly Sins et de Radiant sur le plan arthurien (portée exacte non précisée ; le statut de Radiant comme référence ne change pas dans ce fichier)'
    personnages_arthuriens_inspirations:
    - Perceval
    - Arthur
    - Merlin
    - Lancelot
    - Gauvain
    - Morgan
    - Guenièvre
    lieux_arthuriens_decides:
    - Brocéliande
    - Le Lac (de la Dame du Lac)
    lieux_arthuriens_envisages:
    - Douloureuse Garde
    - Bénoïc
    - Gaunes
    - Trèbes
    - Montlair
    - La Terre Déserte
    note_lieux: 'U, 11 oct. 2026 : il a accepté ces lieux mais ne les connaît pas tous ; hormis Brocéliande et Le Lac, il n''a fait aucune recherche sur eux ; ils passent donc de décidé à envisagé'
    exception_lieux: 'exception décidée par l''utilisateur : lieux gardés pour la langue française du texte, même s''ils ne sont pas situés en France (La Douloureuse Garde ; sa localisation n''a pas été vérifiée)'
    abandonne:
    - 'Merlin, Arthur, Lancelot comme personnages de toile de fond (envisagé puis écarté le 2026-10-09)'
    note_merlin: 'U, 11 oct. 2026 : Merlin était de base un personnage de l''œuvre ; la décision du 9 oct. le concernant reste la plus récente'
  personnages_edenia:
  - nom: Cosmo Dumas
    inspire_de:
    - Ekko
    - Killua Zoldyck
    - Shisui Uchiha
    tenue_inspiration: Academy Ekko (deux images), voir esthetique_vestimentaire
  - nom: Brann
