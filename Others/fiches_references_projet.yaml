  inspirations_issues_des_brouillons:
    source: U, brouillons de worldbuilding (documents Worldbulding parties 1 et 2), validé le 11 oct. 2026
    statut_decision: interet
    elements:
    - Bibliothèque bleue (le contenu des livres ; U précise que cela n'a rien à voir avec le métier de colporteur)
    - Renaissance (la science, le folklore, les superstitions, les croyances et la magie)
    - bas et milieu Moyen Âge
    - fantasy épique
    exclusion:
      texte: sans concept métafictionnel ni concept qui agit sur la réalité
      note: portée non précisée (peut concerner le système de magie, mis de côté pour l'instant)
  vocabulaire_des_brouillons:
    source: U, brouillons de worldbuilding, validé le 11 oct. 2026
    statut_decision: interet
    titres_et_fonctions:
    - vassal
    - comte
    - baron
    - seigneur
    - empereur
    - intendant
    - shérif
    - chambellan
    - première lame
    - champion
    evenements:
    - tournoi de chevalerie
    - foires
    note: 'éléments de vocabulaire et de décor (aucun n''est une décision) ; voir aussi structure_du_monde.feodalite (envisagé, 16 nov. 2026) et institutions_et_statuts_en_interet.chevalier (intérêt, 16 nov. 2026)'
  institutions_et_statuts_en_interet:
    source: 'U, 16 nov. 2026 (carnet § 5.5)'
    chevalier:
      texte: 'retenu en intérêt d''abord comme statut social et martial dans le cadre féodal (couche 2 : combattant reconnu par un titre ou adoubement, lié par un serment, des droits et des devoirs, compatible avec la magie et des tenues souples), avec l''imagerie de l''armure lourde classique en option réservée à certains personnages ou groupes (couche 1)'
      recits_de_chevalerie: 'récits de chevalier d''époque médiévale et Renaissance (couche 3, charpentes narratives) : intérêt ouvert, non limité à un seul modèle de récit afin de ne pas biaiser un choix futur (tout ce qui touche à la structure narrative reste au niveau intérêt)'
      statut_decision: interet
      note: 'U, 16 nov. 2026 (à relier au goal de Brann, au tournoi de chevalerie, à Fabula Fantasia et au Cycle de la Vulgate)'
    scholomance:
      texte: 'école ou institution de magie pensée sur le principe « Harry Potter, mais différent » (les différentes manières de s''en distinguer restent ouvertes ; orthographe usuelle : Scholomance, mot-clé jugé limpide et évocateur par U)'
      statut_decision: interet
      note: 'U, 16 nov. 2026 (à relier à Harry Potter et à la piste d''école en Brocéliande)'
  pistes_systeme_de_magie:
    source: 'U, 16 nov. 2026 (carnet § 5.5)'
    note_statut: 'termes, mots-clés et concepts jugés limpides, évocateurs et bien accordés à l''univers par U ; le système de magie n''est pas encore arrêté (les quatre briques sont au statut intérêt)'
    cible_tactique:
      texte: 'système de magie et combats pensés pour être au niveau tactique de World Trigger, Jujutsu Kaisen et Hunter × Hunter'
      statut_decision: envisage
      source: 'U, 16 nov. 2026'
    briques:
    - element: Mana (nom provisoire)
      texte: 'source de la magie : évoque un système doté d''une source ésotérique (nom explicitement provisoire)'
      statut_decision: interet
    - element: 'Source, Shaper, Sink, Target'
      texte: 'quatre composantes évoquant un système de magie complexe mais clair (source d''énergie, façonnage/direction, absorption du contrecoup, cible/effet ; terminologie issue des conférences de thaumatologie de la GOC sur le wiki de la Fondation SCP)'
      statut_decision: interet
    - element: Body, Mind and Soul
      texte: 'catégorisation de pouvoirs (Corps, Esprit, Âme ; appréciée par U pour le principe de catégorisation claire)'
      statut_decision: interet
    - element: Consciences
      texte: 'terme lié à la fois à la mécanique du système et au thème de l''univers'
      statut_decision: interet
  occultisme:
    place_dans_l_oeuvre:
      texte: 'esthétique et grammaire/culture concrète du surnaturel présente dans beaucoup de concepts de l''œuvre (savoirs d''initiés et savoir caché, symboles, traités, pratiques, objets et milieux variés) : dépasse le simple habillage visuel, sans constituer un thème philosophique ou mystique ni le sujet central (« cran 2 » validé par U ; U précise que le mot « thème » n''était pas adéquat)'
      statut_decision: envisage
      source: 'U, 16 nov. 2026 (carnet § 5.5)'
    historique_7_oct: 'le 7 oct. 2026, penchait vers la seule ambiance (atmosphère de symboles, de décors et d''objets rituels, sans que l''histoire porte dessus), place alors laissée non tranchée car le terme était jugé trop vague'
    precision_livres: '(U, 7 oct.) les livres de sorts seraient classiques et sans effet visuel magique ; sauf peut-être un accessoire lié à un pouvoir ; rien n''est décidé, détail modifiable ; ce qui compte surtout : les symboles sur le livre'
    registre_tonal:
      texte: 'registre de l''occulte, du marais et de la pègre : conte théâtral, vivant et aventureux (esprit Facilier / Mama Odie / Shrek), non « dark », sans glisser vers le gothique poisseux ni le grimdark'
      statut_decision: decide
      source: 'carnet de bord (§ 5.4, point 3), validé en décidé par U le 16 nov. 2026'
  heritages_melanges:
    facons_retenues:
    - dans les mêmes tenues
    - répartis par régions
    statut: les deux façons conviennent ; articulation non décidée
  inspirations_visuelles_non_decidees:
  - element: personnages d'inspiration asiatique
    statut_decision: envisage
    note: pas décidé
  - element: objets bouddhiques japonais (perles de prière, bâton à anneau et clochettes, dangos)
    statut_decision: interet
    note: goût ; pas un héritage décidé ; ce sont des objets de culte, pas seulement de style (point accepté par U)
  style_de_dessin:
    meme_style_edenia_et_arcana:
      texte: même style artistique pour Edenia et Arcana (certains tests très urbains et modernes sont plus proches d'Arcana)
      statut_decision: decide
      source: 'U, 15 oct. 2026 : « le style artistique sur les deux œuvres reste logiquement le même » ; certains tests, « ultra urbain et moderne », sont plus proches d''Arcana'
    styles_cites:
      texte: Jujutsu Kaisen, atie1225, Shadman, Disney/Pixar, Spider-Verse, Naruto, Gachiakuta et Quirkilicious
      statut_decision: non_precise
      source: 'U, 15 oct. 2026 : « Je crois que mon style artistique se trouve dans Jujutsu Kaisen, atie1225, Shadman, Disney/Pixar, Spider-Verse, Naruto, Gachiakuta et Quirkilicious »'
    chara_design_et_rendu:
      texte: 'expressivité d''animation occidentale (visages variés, regards francs, nez et sourcils dessinés, hors registre moe) + encrage shōnen nerveux + noir et blanc lumineux à 4 valeurs et trames de points'
      statut_decision: envisage
      source: 'carnet de bord (§ 5.4, point 2), classé en envisagé par U le 16 nov. 2026'
    tests_pixai:
      statut: tests de style, non canon (U)
      contenu: '12 images générées avec PixAI jointes le 15 oct. 2026 (aucune de ces 12 images ne représente Brann, Cosmo ou Harley ; toutes dites « Edenia compatible », tests 09 et 10 à rendre légèrement moins modernes à cause du jean) + versions noir et blanc des tests 11 et 12 jointes le 16 oct. 2026. Documents de tests titrés « Arcana » (PixAI Arcana 2 et 2.1, PixAI_Arcana_Art parties 1 et 2, créés le 14 sept.) ; les autres tests partent de personnages existants (Robin, Raven, Nami, Violet Parr, Gwen, Miles Morales…)'
      cosmo_dumas: 'dans les documents de tests : seul essai portant sur un personnage d''Edenia (« un essai », U, 15 oct. 2026), pas une piste de design (hors des 12 images du wiki)'
      outils: 'modèles Illustrious (coco-style v2, v3 et surtout v7 ; WAI-NSFW-illustrious-SDXL v14 ; WAI-illustrious-SDXL v16), LoRA ATIE1225 STYLE et Gachiakuta (Manga Style + Cover Art Style), LoRA manga noir et blanc « JUJUTSU KAISEN style(MANGA) | Gege Akutami style [OLD] » (tests 11 et 12 N&B, U, 17 oct. 2026), accélérateur DMD2 (U, 15-17 oct. 2026)'
      tier_liste_tags: '11 tags de personnages classés par U le 18 oct. 2026 selon le rendu PixAI (S : Violet Parr, Gwen Stacy/Spider-Verse, Gwen Tennyson, Raiponce ; A : Astrid, Raven, Miles Morales, Robin ; B : Nami, Shego, Starfire) ; préférence pour le LoRA Raven SHDBS sur le tag'
  ambiance_des_lieux:
    statut_decision: envisage
    sources_visuelles: 'cinq images de décors naturels : trois peintures de développement de Shrek, une double page couleur du manga Naruto (chapitre 679), une illustration numérique de style manga (probablement générée par IA)'
    ambiance:
      texte: scènes d'ambiance qui dégagent une atmosphère de conte européen au sens large (tous types de contes), aventureuse
      source: U
    usage_des_images:
      texte: réservoir d'éléments à combiner (lieu, personnage, couleur, etc.) ; pas un modèle de parcours ni de voyage
      source: U
    a_preciser: vocabulaire des paysages (plaine, plateau, lande, colline, steppe) ; « montagnard » écarté comme terme pour ces images (U) ; l'utilisateur veut d'abord un vocabulaire plus précis avant d'ajouter des zones
    zones_naturelles:
    - nom: Forêt de conte
      description: forêts de feuillus et de conifères, collines herbeuses avec pierres dressées, champs et chemins ; quelques constructions anciennes en bois ou en pierre ; atmosphère de conte européen, aventureuse
      statut_decision: decide
      source: 'U : zone demandée le 8 oct. 2026 d''après ses images de décors, puis dite « décidée » le 9 oct. 2026 ; le nom et la formulation de la description sont de l''IA, à valider'
    - nom: Région montagnarde enneigée
      description: région de montagne enneigée (formulation de U)
      creature_locale: 'Barbegazi (statut des Barbegazi : envisagé, pas décidé ; U, 9 oct. 2026)'
      statut_decision: decide
      images: en attente d'images de l'utilisateur
      source: 'U, 9 oct. 2026 (« décidé, pour la région ») ; le nom reprend ses mots, formulation de l''IA'
    zones_issues_des_brouillons:
      source: U, liste de zones d'un brouillon (document sans titre 29), validée le 11 oct. 2026
      statut_decision: interet
      note: 'U veut d''abord préciser le vocabulaire des paysages avant d''ajouter des zones (voir a_preciser plus haut) ; la liste mentionne aussi Ionia, Freljord, Tibétains-Yéti et Piltover-BioShock 1 / Gadgetzan, non reportés ici (validation limitée aux zones ci-dessous) ; inspirés des MMORPG et des contes (U)'
      zones:
      - nom: Nouvelle-Orléans / Caraïbes
        inspiration: Bilgewater
        precisions: 'deux images de La Princesse et la Grenouille (le bayou, le salon du sorcier) rattachées à cette zone et au marais (U, 12 oct. 2026 ; vigilance : le film se passe dans les années 1920, seuls les décors respectent le plafond décidé de 1914) ; registre non « dark » de conte théâtral et vivant décidé le 16 nov. 2026'
      - nom: Piltover / Columbia
      - nom: mafieux années 20-30 (prohibition)
        correction: 'U, 12 oct. 2026 : on ne garde que la structure sociale (la mafia) ; jamais au-delà de 1914 (le nom ci-dessus est celui du brouillon)'
        sources_citees: 'Chicago Spirit (Fondation SCP), occultisme des années 1890-1910, BioShock 1 (U, 12 oct. 2026) ; registre non « dark » décidé le 16 nov. 2026'
      - nom: marais
        description: marais style bayou ou marais de Shrek (U, 11 oct. 2026) ; la liste du brouillon cite Shrek et Velen (The Witcher)
        precisions: 'deux images de La Princesse et la Grenouille rattachées le 12 oct. 2026 (U) ; registre non « dark » de conte théâtral, vivant et aventureux (esprit Facilier / Mama Odie / Shrek) décidé le 16 nov. 2026'
      - nom: Brocéliande
        description: forêt féerique avec une école (type Harry Potter)
      - nom: Empire
      - nom: habitat rural
        description: village, château, donjon, maisons éparses
      region_desertique:
        texte: 'région désertique inspirée du Languedoc (U, 11 oct. 2026, « je crois »), des Plaines Brisées (The Stormlight Archive) et du western comme paysage (U, 12 oct. 2026) ; piste ouverte d''ancrage du paysage « western » dans une Europe / France via un Sud minéral de type Languedoc / causses (carnet § 5.4, point 5, classé en intérêt par U le 16 nov. 2026) ; « Terre dévastée » est une proposition de l''IA, pas un nom de brouillon de U (correction de U, 12 oct. 2026)'
        statut_decision: interet
    pierres_levees: pour l'instant seulement pour l'ambiance ; rôle non décidé ; il ne préférerait pas la même scène sans les pierres (U)
    statut_des_images: moodboard, pas canon (U) ; pas de décision sur les éléments des images
